defaults:
  - /preprocessing/encoder@encoder: complex
  - /preprocessing/scaler@scaler: null
  - _self_

_target_: lightgbm.LGBMRegressor

n_estimators: 300

learning_rate: 0.05

num_leaves: 31

random_state: ${seed}

verbose: -1

is_cat: true

is_scale: false

grid_params:
  model__objective: ["regression"]
  model__max_depth: [3, 5, 7, 9]
  model__num_leaves: [15, 31, 63, 127]
  model__n_estimators: [100, 250, 500]
  model__learning_rate: [0.01, 0.05, 0.1, 0.2]
  model__reg_lambda: [0.01, 0.1, 1.0, 10.0]
  model__reg_alpha: [0.0, 0.1, 1.0, 10.0]
  model__min_child_samples: [5, 10, 25, 50]
  model__subsample: [0.5, 0.7, 1.0]
  model__colsample_bytree: [0.5, 0.7, 1.0]