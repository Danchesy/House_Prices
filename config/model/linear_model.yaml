defaults:
  - /preprocessing/scaler@scaler: standard
  - /preprocessing/encoder@encoder: complex
  - _self_

_target_: sklearn.linear_model.ElasticNet

alpha: 1e-2

l1_ratio: 0.5

fit_intercept: true

is_cat: ${preprocessing.encode_categorical}

is_scale: ${preprocessing.scale_numeric}

grid_params:
  model__alpha: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  model__l1_ratio: [0.0, 0.25, 0.5, 0.75, 1.0]
  model__fit_intercept: [true, false]